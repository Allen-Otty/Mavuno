<title>Mavuno – Farm to plate, Kenya</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f6f8f3;--card:#fff;--ink:#16221a;--mut:#6b7a6e;--g:#3c8c2a;--g2:#e8f3e1;--line:#e3e9dd;--grad:linear-gradient(135deg,#7bb83a,#2f7d1f);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
i{font-style:normal;color:#d7f27a}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 16px;background:var(--grad);color:#fff;border-radius:0 0 24px 24px}
header b{font-size:22px}header a{color:#fff;font-weight:600}
section{padding:12px 14px;max-width:760px;margin:auto}h3{margin:16px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;margin:5px 0;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}
input.bad{border-color:#b3261e}.err{display:block;color:#b3261e;font-size:12px}
.btn,button{background:var(--grad);color:#fff;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}button.alt{background:var(--g2);color:var(--g)}button.bad{background:#b3261e}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.mut{color:var(--mut)}.small{font-size:13px}.c{text-align:center}
.tag{display:inline-block;background:var(--g2);color:var(--g);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700}
.banner{background:var(--grad);color:#fff;border-radius:20px;padding:18px;margin:10px 0}.banner b{font-size:19px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;white-space:nowrap;padding:8px 14px;font-weight:600}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;cursor:pointer}
.pc img,.pc .em{width:100%;height:92px;object-fit:cover;border-radius:12px;background:var(--g2);display:flex;align-items:center;justify-content:center;font-size:40px}
.pp{color:var(--g);font-weight:800;margin-top:4px}.pp span{font-weight:400;color:var(--mut);font-size:12px}
#map{height:calc(100vh - 200px);min-height:300px;border-radius:18px;background:var(--g2)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;color:var(--mut);text-decoration:none;font-weight:600;font-size:12px}nav a span{font-size:20px}nav a.on{color:var(--g)}
.hero{background:var(--grad);color:#fff;padding:calc(env(safe-area-inset-top) + 40px) 22px 34px;border-radius:0 0 30px 30px}.hero b{font-size:36px;display:block}
.auth{max-width:420px;margin:0 auto;padding:18px 20px}.auth h2{margin:6px 0}
.splash{position:fixed;inset:0;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .5s}.splash.off{opacity:0}.splash b{font-size:46px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:9}
#sheet[hidden],[hidden]{display:none!important}
#sheet>div{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px;max-width:760px;margin:auto}
#toast{position:fixed;left:12px;right:12px;bottom:84px;background:#222;color:#fff;padding:12px;border-radius:14px;z-index:60;text-align:center}
#pick{background:#fff3cd;color:#664d03;padding:10px 14px;text-align:center;font-weight:600}
.msgs{max-height:220px;overflow:auto;margin:8px 0}.m{padding:6px 10px;border-radius:14px;margin:3px 0;max-width:80%;background:var(--g2)}.m.me{margin-left:auto;background:var(--g);color:#fff}
img.ph{width:54px;height:54px;object-fit:cover;border-radius:12px}.pr{display:flex;gap:10px;align-items:center;margin:8px 0}.pr>div{flex:1}.pr input{width:72px}

.abg{position:fixed;inset:0;z-index:-1;background:linear-gradient(118deg,transparent 36%,rgba(232,170,60,.6) 36.4%,transparent 37.6%),linear-gradient(123deg,transparent 45%,rgba(255,214,90,.4) 45.3%,transparent 46.4%),linear-gradient(112deg,transparent 56%,rgba(190,120,30,.35) 56.5%,transparent 58%),radial-gradient(90% 70% at 8% 12%,rgba(176,112,24,.55),transparent 60%),radial-gradient(70% 60% at 100% 100%,rgba(120,80,20,.5),transparent 60%),#0a0a0a}
.awrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 18px) 16px 24px}
.abrand{color:#fff;font-size:30px;font-weight:800;margin-bottom:14px}.abrand i{color:#ffd3bf}
.glass{width:100%;max-width:430px;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.06));clip-path:polygon(30px 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%,0 30px);animation:pop .4s ease}
.gi{background:rgba(16,16,16,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:26px 22px 20px;color:#fff;clip-path:polygon(30px 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%,0 30px)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.gi h2{margin:0;font-size:28px}.gi h2 em{font-style:normal;color:#ffd3bf}.gi .sub{color:#a8a8a8;font-size:13px;margin:2px 0 14px}
.lb{display:block;font-size:13px;font-weight:600;margin-top:10px}
.f{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:0 12px;margin:5px 0;color:#9a9a9a}
.f:focus-within{border-color:#ffd3bf;box-shadow:0 0 0 3px rgba(255,211,191,.25)}
.f input,.f select{border:0;background:none;color:#fff;margin:0;padding:12px 0;border-radius:0;outline:0}.f select option{color:#000}
.eye{background:none;color:#ffd3bf;padding:4px 0;font-size:12px;flex:0 0 auto;border-radius:6px}
.gi .err{color:#ff8a80}.gi .f:has(.bad){border-color:#ff6b6b}
.opts{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:12px 0;gap:8px}.opts label{display:flex;align-items:center;gap:6px}.opts input{width:auto;margin:0;accent-color:#ffd3bf}
.gi a{color:#ffd3bf;font-weight:600}.gi .mut{color:#a8a8a8}
.go{width:100%;background:linear-gradient(180deg,#ffe14d,#f5c400);color:#111;box-shadow:0 6px 26px rgba(255,208,0,.35);margin-top:6px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.splash{background:#0a0a0a}.splash i{color:#ffd3bf}

:root{--bg:#f3d3c3;--card:rgba(255,255,255,.38);--ink:#3b1d14;--mut:#8b6658;--g:#d2452d;--g2:rgba(255,255,255,.5);--line:rgba(255,255,255,.6);--grad:linear-gradient(135deg,#ff8a63,#e0452f);--glass:rgba(255,255,255,.38);color-scheme:light}
body{background:radial-gradient(60% 40% at 10% 8%,#ffb9a0 0,transparent 70%),radial-gradient(50% 40% at 95% 30%,#ffd9b8 0,transparent 70%),radial-gradient(60% 50% at 70% 100%,#e8795c 0,transparent 70%),#f3d3c3;background-attachment:fixed}
header{background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);color:var(--ink);margin:10px 12px 0;border:1px solid var(--line);border-radius:22px;padding:12px 16px;box-shadow:0 8px 30px rgba(140,60,35,.15)}
header a,header i{color:var(--g)}
.card,.pc,.chip,nav,.tile,.gcard,#sheet>div,.cr,.cl,.cv,input,select,textarea{backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.card,.pc,.tile,.gcard{background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 30px rgba(140,60,35,.14)}
.chip{background:var(--glass)}.chip.on{background:var(--grad)}
input,select,textarea{background:rgba(255,255,255,.55);border-color:var(--line)}
nav{background:var(--glass);border:1px solid var(--line);margin:0 12px calc(8px + env(safe-area-inset-bottom));border-radius:22px;left:0;right:0;padding-bottom:0;max-width:560px;margin-inline:auto}
#sheet>div{background:rgba(255,236,226,.82)}
.banner,.hero2{box-shadow:0 12px 32px rgba(224,69,47,.35)}
.m.me{background:var(--grad)}.m{background:rgba(255,255,255,.6)}.m small{display:block;font-size:10px;opacity:.7;margin-top:2px}
.abg{background:radial-gradient(60% 50% at 15% 10%,rgba(255,122,89,.75),transparent 70%),radial-gradient(55% 45% at 90% 85%,rgba(224,69,47,.65),transparent 70%),radial-gradient(40% 35% at 85% 15%,rgba(255,190,140,.45),transparent 70%),#1d0f0b}
.go{background:var(--grad);color:#fff;box-shadow:0 6px 26px rgba(224,69,47,.45)}.splash{background:#1d0f0b}
/* dashboard */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hero2{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--grad);color:#fff;border-radius:24px;padding:18px}
.hero2 h2{margin:2px 0;font-size:20px}.hero2 small{opacity:.85}
.tile{border-radius:20px;padding:14px}.tile small{color:var(--mut)}.tile b{display:block;font-size:22px}
.gcard{border-radius:20px;padding:14px;grid-column:1/-1}.gcard svg{width:100%;height:auto;display:block}.days{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.lime{background:linear-gradient(160deg,#dff58a,#b9e24f);color:#26340a;border-radius:20px;padding:14px;grid-column:1/-1}
.bar{background:rgba(255,255,255,.7);border-radius:99px;height:10px;margin:3px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:#26340a;border-radius:99px}
.add{grid-column:1/-1;border:2px dashed rgba(255,255,255,.9);border-radius:20px;text-align:center;padding:14px;font-weight:700;color:var(--g);cursor:pointer}
@media (min-width:620px){.bento{grid-template-columns:repeat(4,1fr)}.hero2{grid-column:span 4}.gcard{grid-column:span 2}.lime{grid-column:span 2}.add{grid-column:span 4}}
/* chat */
.av{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;color:#fff;font-weight:700;flex:0 0 auto;font-size:15px}.av.lg{width:40px;height:40px}
.avs{display:flex;gap:12px;overflow-x:auto;padding:6px 0 10px}.avs div{text-align:center;font-size:11px;color:var(--mut);max-width:56px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cr{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;cursor:pointer;margin:4px 0}.cr.on,.cr:hover{background:var(--glass)}
.cb{flex:1;min-width:0}.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}.ellip{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bdg{background:var(--grad);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.ch{display:flex;align-items:center;gap:10px;padding:6px 0 10px;border-bottom:1px solid var(--line)}.back{flex:0;padding:8px 12px}
#v-chat .msgs{max-height:none;height:calc(100vh - 330px);min-height:240px;padding:8px 0}
.sys{text-align:center;font-size:12px;color:var(--mut);background:var(--glass);border-radius:99px;padding:4px 12px;margin:6px auto;width:max-content;max-width:92%}
.mi{display:flex;gap:8px}.mi input{margin:0}.mi button{flex:0;border-radius:99px;padding:0 18px}
.cwrap .cv{display:none}#v-chat.open .cl{display:none}#v-chat.open .cv{display:block}
@media (min-width:820px){#v-chat{max-width:980px}.cwrap{display:grid;grid-template-columns:340px 1fr;gap:14px}.cwrap .cl,.cwrap .cv,#v-chat.open .cl,#v-chat.open .cv{display:block}.back{display:none}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" hidden></div>
<div class="splash" id="splash"><b>Mavuno<i>.</i></b><span>Fresh from the farm, straight to you</span></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ---- Config: the Supabase key below is a public (publishable) key; row-level security protects the data.
const SB_URL = "https://ukkwimgzbyjwnqknuxwe.supabase.co", SB_KEY = "sb_publishable_73UzjLEo5224KMqycG6-Xg_G3i854Vc";
// Paste a Google Maps JavaScript API key here (restrict it to your site address in Google Cloud). Empty = free OpenStreetMap fallback.
const GMAPS_KEY = "";

const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ok = r => { if (r.error) throw r.error; return r.data; };
const toast = m => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 4000); };
const nice = m => /invalid login/i.test(m) ? "Wrong email or password." : /not confirmed/i.test(m) ? "Please confirm your email first. Check your inbox and spam." : m;
const guard = f => async (...a) => { try { await f(...a); } catch (x) { toast(nice(x.message || String(x))); } };
const hideSplash = () => setTimeout(() => { const s = $("#splash"); if (s) { s.classList.add("off"); setTimeout(() => s.remove(), 500); } }, Math.max(0, 900 - (Date.now() - S.t0)));
function check(el) { const v = el.value, m = el.name === "email" && !/^\S+@\S+\.\S+$/.test(v.trim()) ? "That email doesn't look right." : el.name === "password" && v.length < 6 ? "Use 6 or more characters." : el.name === "confirm" && v !== el.form.password.value ? "Passwords don't match." : ""; const s = (el.closest(".f") || el).nextElementSibling; if (s && s.classList.contains("err")) s.textContent = m; el.classList.toggle("bad", !!m); return !m; }
const S = { u: null, p: null, farm: null, farms: [], v: "map", timer: null, uid: undefined, t0: Date.now(), cat: "All" };
let M = null, pickCb = null;

// ---- Map: Google Maps if a key is set, otherwise OpenStreetMap via Leaflet
const loadScript = src => new Promise((r, j) => { const s = document.createElement("script"); s.src = src; s.onload = r; s.onerror = j; document.head.appendChild(s); });
async function initMap() {
  const el = $("#map"), c = { lat: 0.2, lng: 37.9 };
  if (GMAPS_KEY) {
    await loadScript("https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(GMAPS_KEY));
    const g = new google.maps.Map(el, { center: c, zoom: 6, streetViewControl: false, mapTypeControl: false }); let mk = [];
    g.addListener("click", e => pickCb && pickCb(e.latLng.lat(), e.latLng.lng()));
    M = { clear() { mk.forEach(m => m.setMap(null)); mk = []; }, add(lat, lng, t, fn) { const m = new google.maps.Marker({ position: { lat, lng }, map: g, title: t }); m.addListener("click", fn); mk.push(m); }, go(lat, lng, z) { g.setCenter({ lat, lng }); g.setZoom(z); }, fix() { google.maps.event.trigger(g, "resize"); } };
  } else {
    const m = L.map(el).setView([c.lat, c.lng], 6), grp = L.layerGroup().addTo(m);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(m);
    m.on("click", e => pickCb && pickCb(e.latlng.lat, e.latlng.lng));
    M = { clear() { grp.clearLayers(); }, add(lat, lng, t, fn) { L.marker([lat, lng], { title: t }).on("click", fn).addTo(grp); }, go(lat, lng, z) { m.setView([lat, lng], z); }, fix() { m.invalidateSize(); } };
  }
}

// ---- Auth screens
const IC = { mail: '<path d="M3 6h18v12H3zM3 6l9 7 9-7"/>', lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>', phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>', pin: '<path d="M12 21s7-6 7-12a7 7 0 10-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>' };
const ic = k => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const fld = (label, icon, input, extra = "") => `<label class="lb">${label}</label><div class="f">${ic(icon)}${input}${extra}</div><small class="err"></small>`;
const eye = `<button type="button" class="eye" data-a="eye">Show</button>`;
function authView(mode = "in") {
  const up = mode === "up";
  $("#app").innerHTML = `<div class="abg"></div><div class="awrap"><div class="abrand">Mavuno<i>.</i></div><div class="glass"><div class="gi">
  <h2>${up ? "Create <em>Account</em>" : "Welcome <em>Back</em>"}</h2><div class="sub">${up ? "Join Mavuno to buy or sell fresh produce" : "Sign in to your Mavuno account"}</div>
  <form data-f="${mode}" novalidate>
  ${up ? fld("Full name", "user", `<input name="full_name" placeholder="Your name" required autocomplete="name">`) + fld("Phone", "phone", `<input name="phone" placeholder="07…" inputmode="tel" required autocomplete="tel">`) + fld("County", "pin", `<input name="county" placeholder="e.g. Meru" required>`) + fld("I am a", "user", `<select name="role"><option value="buyer">Buyer</option><option value="farmer">Farmer</option></select>`) : ""}
  ${fld("Email address", "mail", `<input name="email" type="email" placeholder="name@domain.com" required autocomplete="email">`)}
  ${up ? `<div class="two"><div>${fld("Password", "lock", `<input name="password" type="password" placeholder="Password" required autocomplete="new-password">`, eye)}</div><div>${fld("Confirm", "lock", `<input name="confirm" type="password" placeholder="Repeat" required autocomplete="new-password">`)}</div></div>
  <div class="opts"><label><input type="checkbox" name="terms"> I agree to the Terms and Privacy Policy</label></div>`
    : fld("Password", "lock", `<input name="password" type="password" placeholder="Your password" required autocomplete="current-password">`, eye) + `<div class="opts"><label><input type="checkbox" name="rem" checked> Remember me</label><a href="#" data-a="reset">Forgot password?</a></div>`}
  <button class="go">${up ? "Create Account" : "Sign In"} →</button></form>
  <p class="mut c small" style="margin:14px 0 0">${up ? `Already have an account? <a href="#" data-a="auth" data-m="in">Sign in</a>` : `Don't have an account? <a href="#" data-a="auth" data-m="up">Sign up</a>`}</p>
  ${up ? `<p class="mut c small" style="margin:6px 0 0">No email? Make a free Gmail first.</p>` : ""}</div></div></div>`;
  document.body.style.background = "#1d0f0b"; hideSplash();
}

// ---- App shell
function shell() {
  const fm = S.p.role === "farmer", n = (v, i, t) => `<a href="#" data-a="nav" data-v="${v}"><span>${i}</span>${t}</a>`;
  $("#app").innerHTML = `<header><div><b>Mavuno<i>.</i></b><div class="small">Hi ${esc((S.p.full_name || "").split(" ")[0])} · ${esc(S.p.county || "Kenya")}</div></div><a href="#" data-a="out">Log out</a></header>
  <div id="pick" hidden></div>
  <section id="v-home"><input id="q" placeholder="Search produce, farm or county">
  <div class="banner"><b>Fresh from local farms</b>Order straight from the farmer. Pay on delivery.</div>
  <div class="chips" id="chips"></div><h3>Fresh produce</h3><div class="grid" id="grid"></div><h3>Farms near you</h3><div id="list"></div></section>
  <section id="v-map" hidden><div id="map"></div></section>
  <section id="v-chat" hidden></section><section id="v-orders" hidden></section><section id="v-farm" hidden></section>
  <nav>${n("home", "🏠", "Home")}${n("map", "📍", "Map")}${n("chat", "💬", "Chats")}${n("orders", "📊", "Dashboard")}${fm ? n("farm", "🌱", "My farm") : ""}</nav><div id="sheet" hidden></div>`;
  document.body.style.background = ""; show("home"); initMap().then(loadFarms).catch(x => toast("Map failed to load: " + x.message)); hideSplash();
}
function show(v) {
  S.v = v; stopChat();
  S.chat = null; ["home", "map", "orders", "farm", "chat"].forEach(k => { const e = $("#v-" + k); if (e) e.hidden = k !== v; });
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === v));

document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, b = f.querySelector("button:not([type=button])");
  if (["in", "up"].includes(f.dataset.f) && ![...f.querySelectorAll("[name=email],[name=password],[name=confirm]")].map(check).every(Boolean)) return;
  if (f.dataset.f === "up" && !f.terms.checked) return toast("Please agree to the Terms and Privacy Policy.");
  const t = b?.textContent; if (b) { b.disabled = true; b.textContent = "Please wait…"; }
  await guard(F[f.dataset.f])(new FormData(f), f);
  if (b && b.isConnected) { b.disabled = false; b.textContent = t; }
});

// ---- Start-up
async function start(u) {
  S.u = u; if (!u) return authView("in");
  if (localStorage.getItem("mv_rem") === "0" && !sessionStorage.getItem("mv_alive")) { await sb.auth.signOut(); return; }
  S.p = ok(await sb.from("profiles").select("*").eq("id", u.id).single());
  if (S.p.role === "farmer") S.farm = ok(await sb.from("farms").select("*").eq("owner_id", u.id).limit(1).maybeSingle());
  shell();
}
sb.auth.onAuthStateChange((ev, ses) => {
  if (ev === "PASSWORD_RECOVERY") setTimeout(() => { const p = prompt("Choose a new password (6+ characters)"); if (p) sb.auth.updateUser({ password: p }).then(r => toast(r.error ? r.error.message : "Password changed.")); }, 0);
  const id = ses?.user?.id || null; if (id === S.uid) return; S.uid = id;
  setTimeout(() => guard(start)(ses?.user || null), 0);
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
