<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05352c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Mavuno – Farm to plate, Kenya</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f6f8f3;--card:#fff;--ink:#16221a;--mut:#6b7a6e;--g:#3c8c2a;--g2:#e8f3e1;--line:#e3e9dd;--grad:linear-gradient(135deg,#7bb83a,#2f7d1f);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111a13;--card:#1a251c;--ink:#e8efe6;--mut:#9fb09f;--g:#7fd16a;--g2:#223a26;--line:#2a3a2d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
i{font-style:normal;color:#d7f27a}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 16px;background:var(--grad);color:#fff;border-radius:0 0 24px 24px}
header b{font-size:22px}header a{color:#fff;font-weight:600}
section{padding:12px 14px;max-width:760px;margin:auto}h3{margin:16px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;margin:5px 0;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}
input.bad{border-color:#b3261e}.err{display:block;color:#b3261e;font-size:12px}
.btn,button{background:var(--grad);color:#fff;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}button.alt{background:var(--g2);color:var(--g)}button.bad{background:#b3261e}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.mut{color:var(--mut)}.small{font-size:13px}.c{text-align:center}
.tag{display:inline-block;background:var(--g2);color:var(--g);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700}
.banner{background:var(--grad);color:#fff;border-radius:20px;padding:18px;margin:10px 0}.banner b{font-size:19px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;white-space:nowrap;padding:8px 14px;font-weight:600}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;cursor:pointer}
.pc img,.pc .em{width:100%;height:92px;object-fit:cover;border-radius:12px;background:var(--g2);display:flex;align-items:center;justify-content:center;font-size:40px}
.pp{color:var(--g);font-weight:800;margin-top:4px}.pp span{font-weight:400;color:var(--mut);font-size:12px}
#map{height:calc(100vh - 200px);min-height:300px;border-radius:18px;background:var(--g2)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;color:var(--mut);text-decoration:none;font-weight:600;font-size:12px}nav a span{font-size:20px}nav a.on{color:var(--g)}
.hero{background:var(--grad);color:#fff;padding:calc(env(safe-area-inset-top) + 40px) 22px 34px;border-radius:0 0 30px 30px}.hero b{font-size:36px;display:block}
.auth{max-width:420px;margin:0 auto;padding:18px 20px}.auth h2{margin:6px 0}
.splash{position:fixed;inset:0;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .5s}.splash.off{opacity:0}.splash b{font-size:46px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:9}
#sheet[hidden],[hidden]{display:none!important}
#sheet>div{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px;max-width:760px;margin:auto}
#toast{position:fixed;left:12px;right:12px;bottom:84px;background:#222;color:#fff;padding:12px;border-radius:14px;z-index:60;text-align:center}
#pick{background:#fff3cd;color:#664d03;padding:10px 14px;text-align:center;font-weight:600}
.msgs{max-height:220px;overflow:auto;margin:8px 0}.m{padding:6px 10px;border-radius:14px;margin:3px 0;max-width:80%;background:var(--g2)}.m.me{margin-left:auto;background:var(--g);color:#fff}
img.ph{width:54px;height:54px;object-fit:cover;border-radius:12px}.pr{display:flex;gap:10px;align-items:center;margin:8px 0}.pr>div{flex:1}.pr input{width:72px}

.abg{position:fixed;inset:0;z-index:-1;background:linear-gradient(118deg,transparent 36%,rgba(232,170,60,.6) 36.4%,transparent 37.6%),linear-gradient(123deg,transparent 45%,rgba(255,214,90,.4) 45.3%,transparent 46.4%),linear-gradient(112deg,transparent 56%,rgba(190,120,30,.35) 56.5%,transparent 58%),radial-gradient(90% 70% at 8% 12%,rgba(176,112,24,.55),transparent 60%),radial-gradient(70% 60% at 100% 100%,rgba(120,80,20,.5),transparent 60%),#0a0a0a}
.awrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 18px) 16px 24px}
.abrand{color:#fff;font-size:30px;font-weight:800;margin-bottom:14px}.abrand i{color:#ffd23f}
.glass{width:100%;max-width:430px;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.06));clip-path:polygon(30px 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%,0 30px);animation:pop .4s ease}
.gi{background:rgba(16,16,16,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:26px 22px 20px;color:#fff;clip-path:polygon(30px 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%,0 30px)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.gi h2{margin:0;font-size:28px}.gi h2 em{font-style:normal;color:#ffd23f}.gi .sub{color:#a8a8a8;font-size:13px;margin:2px 0 14px}
.lb{display:block;font-size:13px;font-weight:600;margin-top:10px}
.f{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:0 12px;margin:5px 0;color:#9a9a9a}
.f:focus-within{border-color:#ffd23f;box-shadow:0 0 0 3px rgba(255,210,63,.18)}
.f input,.f select{border:0;background:none;color:#fff;margin:0;padding:12px 0;border-radius:0;outline:0}.f select option{color:#000}
.eye{background:none;color:#ffd23f;padding:4px 0;font-size:12px;flex:0 0 auto;border-radius:6px}
.gi .err{color:#ff8a80}.gi .f:has(.bad){border-color:#ff6b6b}
.opts{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:12px 0;gap:8px}.opts label{display:flex;align-items:center;gap:6px}.opts input{width:auto;margin:0;accent-color:#ffd23f}
.gi a{color:#ffd23f;font-weight:600}.gi .mut{color:#a8a8a8}
.go{width:100%;background:linear-gradient(180deg,#ffe14d,#f5c400);color:#111;box-shadow:0 6px 26px rgba(255,208,0,.35);margin-top:6px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.splash{background:#0a0a0a}.splash i{color:#ffd23f}
</style>
</head>
<body>
<div id="app"></div><div id="toast" hidden></div>
<div class="splash" id="splash"><b>Mavuno<i>.</i></b><span>Fresh from the farm, straight to you</span></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ---- Config: the Supabase key below is a public (publishable) key; row-level security protects the data.
const SB_URL = "https://ukkwimgzbyjwnqknuxwe.supabase.co", SB_KEY = "sb_publishable_73UzjLEo5224KMqycG6-Xg_G3i854Vc";
// Paste a Google Maps JavaScript API key here (restrict it to your site address in Google Cloud). Empty = free OpenStreetMap fallback.
const GMAPS_KEY = "";

const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ok = r => { if (r.error) throw r.error; return r.data; };
const toast = m => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 4000); };
const nice = m => /invalid login/i.test(m) ? "Wrong email or password." : /not confirmed/i.test(m) ? "Please confirm your email first. Check your inbox and spam." : m;
const guard = f => async (...a) => { try { await f(...a); } catch (x) { toast(nice(x.message || String(x))); } };
const hideSplash = () => setTimeout(() => { const s = $("#splash"); if (s) { s.classList.add("off"); setTimeout(() => s.remove(), 500); } }, Math.max(0, 900 - (Date.now() - S.t0)));
function check(el) { const v = el.value, m = el.name === "email" && !/^\S+@\S+\.\S+$/.test(v.trim()) ? "That email doesn't look right." : el.name === "password" && v.length < 6 ? "Use 6 or more characters." : el.name === "confirm" && v !== el.form.password.value ? "Passwords don't match." : ""; const s = (el.closest(".f") || el).nextElementSibling; if (s && s.classList.contains("err")) s.textContent = m; el.classList.toggle("bad", !!m); return !m; }
const S = { u: null, p: null, farm: null, farms: [], v: "map", timer: null, uid: undefined, t0: Date.now(), cat: "All" };
let M = null, pickCb = null;

// ---- Map: Google Maps if a key is set, otherwise OpenStreetMap via Leaflet
const loadScript = src => new Promise((r, j) => { const s = document.createElement("script"); s.src = src; s.onload = r; s.onerror = j; document.head.appendChild(s); });
async function initMap() {
  const el = $("#map"), c = { lat: 0.2, lng: 37.9 };
  if (GMAPS_KEY) {
    await loadScript("https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(GMAPS_KEY));
    const g = new google.maps.Map(el, { center: c, zoom: 6, streetViewControl: false, mapTypeControl: false }); let mk = [];
    g.addListener("click", e => pickCb && pickCb(e.latLng.lat(), e.latLng.lng()));
    M = { clear() { mk.forEach(m => m.setMap(null)); mk = []; }, add(lat, lng, t, fn) { const m = new google.maps.Marker({ position: { lat, lng }, map: g, title: t }); m.addListener("click", fn); mk.push(m); }, go(lat, lng, z) { g.setCenter({ lat, lng }); g.setZoom(z); }, fix() { google.maps.event.trigger(g, "resize"); } };
  } else {
    const m = L.map(el).setView([c.lat, c.lng], 6), grp = L.layerGroup().addTo(m);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(m);
    m.on("click", e => pickCb && pickCb(e.latlng.lat, e.latlng.lng));
    M = { clear() { grp.clearLayers(); }, add(lat, lng, t, fn) { L.marker([lat, lng], { title: t }).on("click", fn).addTo(grp); }, go(lat, lng, z) { m.setView([lat, lng], z); }, fix() { m.invalidateSize(); } };
  }
}

// ---- Auth screens
const IC = { mail: '<path d="M3 6h18v12H3zM3 6l9 7 9-7"/>', lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>', phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>', pin: '<path d="M12 21s7-6 7-12a7 7 0 10-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>' };
const ic = k => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const fld = (label, icon, input, extra = "") => `<label class="lb">${label}</label><div class="f">${ic(icon)}${input}${extra}</div><small class="err"></small>`;
const eye = `<button type="button" class="eye" data-a="eye">Show</button>`;
function authView(mode = "in") {
  const up = mode === "up";
  $("#app").innerHTML = `<div class="abg"></div><div class="awrap"><div class="abrand">Mavuno<i>.</i></div><div class="glass"><div class="gi">
  <h2>${up ? "Create <em>Account</em>" : "Welcome <em>Back</em>"}</h2><div class="sub">${up ? "Join Mavuno to buy or sell fresh produce" : "Sign in to your Mavuno account"}</div>
  <form data-f="${mode}" novalidate>
  ${up ? fld("Full name", "user", `<input name="full_name" placeholder="Your name" required autocomplete="name">`) + fld("Phone", "phone", `<input name="phone" placeholder="07…" inputmode="tel" required autocomplete="tel">`) + fld("County", "pin", `<input name="county" placeholder="e.g. Meru" required>`) + fld("I am a", "user", `<select name="role"><option value="buyer">Buyer</option><option value="farmer">Farmer</option></select>`) : ""}
  ${fld("Email address", "mail", `<input name="email" type="email" placeholder="name@domain.com" required autocomplete="email">`)}
  ${up ? `<div class="two"><div>${fld("Password", "lock", `<input name="password" type="password" placeholder="Password" required autocomplete="new-password">`, eye)}</div><div>${fld("Confirm", "lock", `<input name="confirm" type="password" placeholder="Repeat" required autocomplete="new-password">`)}</div></div>
  <div class="opts"><label><input type="checkbox" name="terms"> I agree to the Terms and Privacy Policy</label></div>`
    : fld("Password", "lock", `<input name="password" type="password" placeholder="Your password" required autocomplete="current-password">`, eye) + `<div class="opts"><label><input type="checkbox" name="rem" checked> Remember me</label><a href="#" data-a="reset">Forgot password?</a></div>`}
  <button class="go">${up ? "Create Account" : "Sign In"} →</button></form>
  <p class="mut c small" style="margin:14px 0 0">${up ? `Already have an account? <a href="#" data-a="auth" data-m="in">Sign in</a>` : `Don't have an account? <a href="#" data-a="auth" data-m="up">Sign up</a>`}</p>
  ${up ? `<p class="mut c small" style="margin:6px 0 0">No email? Make a free Gmail first.</p>` : ""}</div></div></div>`;
  document.body.style.background = "#0a0a0a"; hideSplash();
}

// ---- App shell
function shell() {
  const fm = S.p.role === "farmer", n = (v, i, t) => `<a href="#" data-a="nav" data-v="${v}"><span>${i}</span>${t}</a>`;
  $("#app").innerHTML = `<header><div><b>Mavuno<i>.</i></b><div class="small">Hi ${esc((S.p.full_name || "").split(" ")[0])} · ${esc(S.p.county || "Kenya")}</div></div><a href="#" data-a="out">Log out</a></header>
  <div id="pick" hidden></div>
  <section id="v-home"><input id="q" placeholder="Search produce, farm or county">
  <div class="banner"><b>Fresh from local farms</b>Order straight from the farmer. Pay on delivery.</div>
  <div class="chips" id="chips"></div><h3>Fresh produce</h3><div class="grid" id="grid"></div><h3>Farms near you</h3><div id="list"></div></section>
  <section id="v-map" hidden><div id="map"></div></section>
  <section id="v-orders" hidden></section><section id="v-farm" hidden></section>
  <nav>${n("home", "🏠", "Home")}${n("map", "📍", "Map")}${n("orders", "🧾", "Orders")}${fm ? n("farm", "🌱", "My farm") : ""}</nav><div id="sheet" hidden></div>`;
  document.body.style.background = ""; show("home"); initMap().then(loadFarms).catch(x => toast("Map failed to load: " + x.message)); hideSplash();
}
function show(v) {
  S.v = v; stopChat();
  ["home", "map", "orders", "farm"].forEach(k => { const e = $("#v-" + k); if (e) e.hidden = k !== v; });
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  if (v === "map" && M) M.fix();
}
const nav = guard(async v => { show(v); if (v === "map" || v === "home") await loadFarms(); if (v === "orders") await loadOrders(); if (v === "farm") await farmView(); });

// ---- Farms on the map
async function loadFarms() {
  S.farms = ok(await sb.from("farms").select("id,owner_id,name,description,county,ward,public_lat,public_lng,verified,products(id,name,category,price,unit,quantity_available,photo_url,active)"));
  drawFarms();
}
const EM = { Vegetables: "🥬", Fruits: "🍎", Grains: "🌾", Dairy: "🥛", "Eggs and poultry": "🥚", Meat: "🥩", Other: "🧺" };
function drawFarms() {
  const q = ($("#q")?.value || "").toLowerCase().trim(), cat = S.cat;
  $("#chips").innerHTML = ["All", ...Object.keys(EM)].map(c => `<button class="chip ${c === cat ? "on" : ""}" data-a="cat" data-c="${esc(c)}">${EM[c] || "✨"} ${esc(c)}</button>`).join("");
  const hit = (p, f) => p.active && (cat === "All" || p.category === cat) && (!q || [p.name, f.name, f.county, f.ward].join(" ").toLowerCase().includes(q));
  const fs = S.farms.filter(f => (f.products || []).some(p => hit(p, f)) || (cat === "All" && (!q || [f.name, f.county, f.ward].join(" ").toLowerCase().includes(q))));
  if (M) { M.clear(); fs.forEach(f => f.public_lat != null && M.add(f.public_lat, f.public_lng, f.name, () => openFarm(f.id))); }
  const pr = fs.flatMap(f => (f.products || []).filter(p => hit(p, f)).map(p => ({ p, f })));
  $("#grid").innerHTML = pr.length ? pr.map(({ p, f }) => `<div class="pc" data-a="farm" data-id="${f.id}">${p.photo_url ? `<img loading="lazy" src="${esc(p.photo_url)}" alt="">` : `<div class="em">${EM[p.category] || "🧺"}</div>`}
    <b>${esc(p.name)}</b><div class="small mut">${esc(f.name)}${f.county ? " · " + esc(f.county) : ""}</div><div class="pp">KES ${esc(p.price)}<span> / ${esc(p.unit)}</span></div></div>`).join("")
    : `<p class="mut">${S.farms.length ? "Nothing matches your search." : "No produce yet. Farmers: create an account and add your farm."}</p>`;
  $("#list").innerHTML = fs.map(f => `<div class="card" data-a="farm" data-id="${f.id}" style="cursor:pointer"><b>${esc(f.name)}</b> ${f.verified ? `<span class="tag">Verified</span>` : ""}
    <div class="mut small">${esc([f.ward, f.county].filter(Boolean).join(", "))}</div></div>`).join("");
}
const openFarm = guard(async id => {
  const f = S.farms.find(x => x.id === id); if (!f) return;
  if (f.public_lat != null && M) M.go(f.public_lat, f.public_lng, 12);
  const loc = ok(await sb.from("farm_locations").select("lat,lng").eq("farm_id", id).maybeSingle());
  const mine = S.farm?.id === id, items = (f.products || []).filter(p => p.active);
  $("#sheet").hidden = false;
  $("#sheet").innerHTML = `<div><div class="row"><h3 style="margin:0">${esc(f.name)}</h3><button class="alt" style="flex:0" data-a="close">Close</button></div>
  <p class="mut">${esc([f.ward, f.county].filter(Boolean).join(", "))} ${f.verified ? `<span class="tag">Verified</span>` : `<span class="tag">Not yet verified</span>`}</p>
  <p>${esc(f.description)}</p>
  ${loc ? `<p><a href="https://www.google.com/maps?q=${loc.lat},${loc.lng}" target="_blank" rel="noopener">Open exact farm location</a></p>` : `<p class="mut small">Exact location is shown after you send an order request.</p>`}
  <form data-f="order" data-id="${id}">${items.length ? items.map(p => `<div class="pr">${p.photo_url ? `<img class="ph" loading="lazy" src="${esc(p.photo_url)}" alt="">` : ""}<div><b>${esc(p.name)}</b><div class="mut small">KES ${esc(p.price)} / ${esc(p.unit)}${p.quantity_available != null ? ` · ${esc(p.quantity_available)} available` : ""}</div></div>
    ${mine ? "" : `<input type="number" min="0" step="any" name="q_${p.id}" placeholder="Qty">`}</div>`).join("") : `<p class="mut">Nothing listed yet.</p>`}
  ${mine || !items.length ? "" : `<button class="btn" style="width:100%">Send order request</button><p class="mut small">Pay cash on delivery. Agree delivery details in chat.</p>`}</form></div>`;
});

// ---- Orders and chat
async function loadOrders() {
  stopChat();
  const d = ok(await sb.from("orders").select("id,status,total,created_at,buyer_id,farm_id,farms(name),order_items(quantity,unit_price,products(name,unit))").order("created_at", { ascending: false }));
  $("#v-orders").innerHTML = d.length ? d.map(o => {
    const fmr = S.farm && o.farm_id === S.farm.id, b = (s, t, c = "") => `<button class="${c}" data-a="st" data-id="${o.id}" data-s="${s}">${t}</button>`;
    let act = "";
    if (fmr) act = o.status === "pending" ? b("accepted", "Accept") + b("rejected", "Reject", "bad") : o.status === "accepted" ? b("delivered", "Mark delivered") : "";
    else act = ["pending", "accepted"].includes(o.status) ? b("cancelled", "Cancel", "bad") : o.status === "delivered" ? b("completed", "Confirm received") : "";
    return `<div class="card"><div class="row"><b>${esc(o.farms?.name)}</b><span class="tag" style="flex:0">${esc(o.status)}</span></div>
    <div class="mut small">${fmr ? "Incoming order" : "Your order"} · ${new Date(o.created_at).toLocaleDateString()}</div>
    ${(o.order_items || []).map(i => `<div>${esc(i.quantity)} ${esc(i.products?.unit)} ${esc(i.products?.name)} × KES ${esc(i.unit_price)}</div>`).join("")}
    <div><b>Total KES ${esc(o.total)}</b></div><div class="row" style="margin-top:8px">${act}<button class="alt" data-a="chat" data-id="${o.id}">Chat</button></div><div id="c-${o.id}"></div></div>`;
  }).join("") : `<p class="mut c">No orders yet. Find a farm on the map and send an order request.</p>`;
}
const stopChat = () => { clearInterval(S.timer); S.timer = null; };
const loadMsgs = guard(async id => {
  const box = document.querySelector(`#c-${id} .msgs`); if (!box) return;
  const d = ok(await sb.from("messages").select("sender_id,body,created_at").eq("order_id", id).order("created_at"));
  box.innerHTML = d.map(m => `<div class="m ${m.sender_id === S.u.id ? "me" : ""}">${esc(m.body)}</div>`).join("") || `<p class="mut small">No messages yet. Say hello and agree on delivery.</p>`;
  box.scrollTop = box.scrollHeight;
});
function toggleChat(id) {
  const c = $("#c-" + id), open = c.innerHTML !== ""; document.querySelectorAll("[id^=c-]").forEach(e => e.innerHTML = ""); stopChat();
  if (open) return;
  c.innerHTML = `<div class="msgs"></div><form data-f="msg" data-id="${id}" class="row"><input name="body" placeholder="Type a message" required autocomplete="off"><button style="flex:0">Send</button></form>`;
  loadMsgs(id); S.timer = setInterval(() => loadMsgs(id), 4000);
}

// ---- Farmer: my farm and products
const farmView = guard(async () => {
  S.farm = ok(await sb.from("farms").select("*").eq("owner_id", S.u.id).limit(1).maybeSingle());
  const el = $("#v-farm");
  if (!S.farm) {
    el.innerHTML = `<h3>Set up your farm</h3><form data-f="farm"><input name="name" placeholder="Farm name" required><textarea name="description" rows="2" placeholder="What do you grow or keep?"></textarea>
    <input name="county" placeholder="County" value="${esc(S.p.county)}" required><input name="ward" placeholder="Ward / village">
    <p class="mut small">Farm location. Buyers only see an area about 100 m wide until they send you an order.</p>
    <div class="row"><input name="lat" placeholder="Latitude" required><input name="lng" placeholder="Longitude" required></div>
    <div class="row"><button type="button" class="alt" data-a="gps">Use my location</button><button type="button" class="alt" data-a="pick">Pick on map</button></div>
    <button class="btn" style="width:100%;margin-top:10px">Create farm</button></form>`;
    return;
  }
  const ps = ok(await sb.from("products").select("*").eq("farm_id", S.farm.id).order("created_at", { ascending: false }));
  el.innerHTML = `<div class="card"><b>${esc(S.farm.name)}</b> <span class="tag">${S.farm.verified ? "Verified" : "Awaiting verification"}</span><div class="mut small">${esc([S.farm.ward, S.farm.county].filter(Boolean).join(", "))}</div></div>
  <h3>Add produce</h3><form data-f="prod"><input name="name" placeholder="Product (e.g. Tomatoes)" required>
  <div class="row"><select name="category"><option>Vegetables</option><option>Fruits</option><option>Grains</option><option>Dairy</option><option>Eggs and poultry</option><option>Meat</option><option>Other</option></select>
  <select name="unit"><option>kg</option><option>bunch</option><option>crate</option><option>litre</option><option>piece</option><option>tray</option><option>bag</option></select></div>
  <div class="row"><input name="price" type="number" min="0" step="any" placeholder="Price (KES)" required><input name="qty" type="number" min="0" step="any" placeholder="Quantity available"></div>
  <input name="photo" type="file" accept="image/*"><button class="btn" style="width:100%">Add</button></form>
  <h3>Your produce</h3>${ps.map(p => `<div class="pr">${p.photo_url ? `<img class="ph" src="${esc(p.photo_url)}" alt="">` : ""}<div><b>${esc(p.name)}</b> ${p.active ? "" : `<span class="tag">Hidden</span>`}<div class="mut small">KES ${esc(p.price)} / ${esc(p.unit)} · ${esc(p.quantity_available ?? "–")} available</div></div>
  <button class="alt" style="flex:0" data-a="tog" data-id="${p.id}" data-on="${p.active ? 1 : 0}">${p.active ? "Hide" : "Show"}</button></div>`).join("") || `<p class="mut">No produce yet.</p>`}`;
});

// ---- Click and submit handlers
const A = {
  auth: d => authView(d.m),
  eye: (d, b) => { const i = b.closest(".f").querySelector("input"); i.type = i.type === "password" ? "text" : "password"; b.textContent = i.type === "password" ? "Show" : "Hide"; },
  cat: d => { S.cat = d.c; drawFarms(); },
  reset: guard(async () => { const e = prompt("Your account email"); if (!e) return; ok(await sb.auth.resetPasswordForEmail(e, { redirectTo: location.href.split("#")[0] })); toast("Check your email for the reset link."); }),
  out: () => sb.auth.signOut(),
  nav: d => nav(d.v),
  farm: d => openFarm(d.id),
  close: () => { $("#sheet").hidden = true; },
  chat: d => toggleChat(d.id),
  st: guard(async d => { ok(await sb.from("orders").update({ status: d.s }).eq("id", d.id)); await loadOrders(); toast("Order " + d.s); }),
  tog: guard(async d => { ok(await sb.from("products").update({ active: d.on !== "1" }).eq("id", d.id)); await farmView(); }),
  gps: () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => setLoc(p.coords.latitude, p.coords.longitude), () => toast("Could not get your location. Use Pick on map."), { enableHighAccuracy: true }) : toast("Location is not available on this device."),
  pick: () => { $("#pick").hidden = false; $("#pick").textContent = "Tap your farm on the map"; show("map"); pickCb = (la, lo) => { pickCb = null; $("#pick").hidden = true; setLoc(la, lo); show("farm"); }; }
};
function setLoc(la, lo) { const f = document.querySelector("form[data-f=farm]"); if (f) { f.lat.value = la.toFixed(6); f.lng.value = lo.toFixed(6); } }
document.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (!b) return; e.preventDefault(); A[b.dataset.a]?.(b.dataset, b); });
document.addEventListener("input", e => { if (e.target.id === "q") drawFarms(); });

const F = {
  in: async fd => { localStorage.setItem("mv_rem", fd.get("rem") ? "1" : "0"); sessionStorage.setItem("mv_alive", "1"); ok(await sb.auth.signInWithPassword({ email: fd.get("email").trim(), password: fd.get("password") })); },
  up: async fd => { localStorage.setItem("mv_rem", "1"); sessionStorage.setItem("mv_alive", "1");
    const r = ok(await sb.auth.signUp({ email: fd.get("email").trim(), password: fd.get("password"), options: { emailRedirectTo: location.href.split("#")[0], data: { full_name: fd.get("full_name").trim(), phone: fd.get("phone").trim(), county: fd.get("county").trim(), role: fd.get("role") } } }));
    if (!r.session) { authView("in"); toast("Account created. Open the email we sent you, confirm, then log in."); }
  },
  order: async (fd, f) => {
    const farm = S.farms.find(x => x.id === f.dataset.id), lines = [];
    (farm.products || []).forEach(p => { const q = parseFloat(fd.get("q_" + p.id)); if (q > 0) lines.push({ p, q }); });
    if (!lines.length) return toast("Enter a quantity for at least one product.");
    const total = lines.reduce((s, l) => s + l.q * l.p.price, 0);
    const o = ok(await sb.from("orders").insert({ buyer_id: S.u.id, farm_id: farm.id, total, payment_mode: "cash_on_delivery", fulfilment: "to_negotiate" }).select("id").single());
    const it = await sb.from("order_items").insert(lines.map(l => ({ order_id: o.id, product_id: l.p.id, quantity: l.q, unit_price: l.p.price })));
    if (it.error) { await sb.from("orders").update({ status: "cancelled" }).eq("id", o.id); throw it.error; }
    A.close(); await nav("orders"); toast("Order request sent. Chat with the farmer to agree delivery.");
  },
  msg: async (fd, f) => { ok(await sb.from("messages").insert({ order_id: f.dataset.id, sender_id: S.u.id, body: fd.get("body").trim() })); f.reset(); await loadMsgs(f.dataset.id); },
  farm: async fd => {
    const la = parseFloat(fd.get("lat")), lo = parseFloat(fd.get("lng"));
    if (isNaN(la) || isNaN(lo)) return toast("Set your farm location first.");
    const j = () => (Math.random() - .5) * 0.0018;   // about ±100 m public blur
    const f = ok(await sb.from("farms").insert({ owner_id: S.u.id, name: fd.get("name").trim(), description: fd.get("description").trim(), county: fd.get("county").trim(), ward: fd.get("ward").trim(), public_lat: la + j(), public_lng: lo + j() }).select("id").single());
    ok(await sb.from("farm_locations").insert({ farm_id: f.id, lat: la, lng: lo }));
    toast("Farm created. Now add your produce."); await farmView();
  },
  prod: async (fd, form) => {
    let photo_url = null; const file = fd.get("photo");
    if (file && file.size) {
      if (file.size > 3e6) return toast("Photo is too big. Use one under 3 MB.");
      const path = `${S.u.id}/${Date.now()}-${file.name.replace(/[^\w.]/g, "")}`;
      ok(await sb.storage.from("photos").upload(path, file)); photo_url = sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
    }
    ok(await sb.from("products").insert({ farm_id: S.farm.id, name: fd.get("name").trim(), category: fd.get("category"), unit: fd.get("unit"), price: parseFloat(fd.get("price")), quantity_available: fd.get("qty") === "" ? null : parseFloat(fd.get("qty")), photo_url }));
    toast("Produce added."); await farmView();
  }
};
document.addEventListener("focusout", e => { if (["email", "password", "confirm"].includes(e.target.name) && e.target.closest("form[data-f=in],form[data-f=up]")) check(e.target); });
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, b = f.querySelector("button:not([type=button])");
  if (["in", "up"].includes(f.dataset.f) && ![...f.querySelectorAll("[name=email],[name=password],[name=confirm]")].map(check).every(Boolean)) return;
  if (f.dataset.f === "up" && !f.terms.checked) return toast("Please agree to the Terms and Privacy Policy.");
  const t = b?.textContent; if (b) { b.disabled = true; b.textContent = "Please wait…"; }
  await guard(F[f.dataset.f])(new FormData(f), f);
  if (b && b.isConnected) { b.disabled = false; b.textContent = t; }
});

// ---- Start-up
async function start(u) {
  S.u = u; if (!u) return authView("in");
  if (localStorage.getItem("mv_rem") === "0" && !sessionStorage.getItem("mv_alive")) { await sb.auth.signOut(); return; }
  S.p = ok(await sb.from("profiles").select("*").eq("id", u.id).single());
  if (S.p.role === "farmer") S.farm = ok(await sb.from("farms").select("*").eq("owner_id", u.id).limit(1).maybeSingle());
  shell();
}
sb.auth.onAuthStateChange((ev, ses) => {
  if (ev === "PASSWORD_RECOVERY") setTimeout(() => { const p = prompt("Choose a new password (6+ characters)"); if (p) sb.auth.updateUser({ password: p }).then(r => toast(r.error ? r.error.message : "Password changed.")); }, 0);
  const id = ses?.user?.id || null; if (id === S.uid) return; S.uid = id;
  setTimeout(() => guard(start)(ses?.user || null), 0);
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
