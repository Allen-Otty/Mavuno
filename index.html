<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05352c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Mavuno – Farm to plate, Kenya</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2a1f;--mut:#667366;--g:#2e7d32;--g2:#e3f1e4;--line:#e0dccf;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121a14;--card:#1b261e;--ink:#e8efe6;--mut:#9fb09f;--g:#6fcf76;--g2:#233a27;--line:#2b3a2e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(60px + env(safe-area-inset-bottom))}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:#05352c;color:#fff}
header a{color:#fff}header .mut{color:#b9d3c9;font-size:13px}
section{padding:12px 14px;max-width:760px;margin:auto}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.btn,button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
button.alt{background:var(--g2);color:var(--g)}button.bad{background:#b3261e}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.mut{color:var(--mut)}.small{font-size:13px}.c{text-align:center}
.tag{display:inline-block;background:var(--g2);color:var(--g);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700}
#map{height:42vh;border-radius:14px;margin:8px 0;background:var(--g2)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:14px 4px;color:var(--mut);text-decoration:none;font-weight:600}nav a.on{color:var(--g)}
.auth{max-width:380px;margin:8vh auto;padding:0 18px}.auth h1{margin:0;color:var(--g)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:9}
#sheet[hidden],[hidden]{display:none!important}
#sheet>div{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px;max-width:760px;margin:auto}
#toast{position:fixed;left:12px;right:12px;bottom:76px;background:#222;color:#fff;padding:12px;border-radius:12px;z-index:20;text-align:center}
#pick{background:#fff3cd;color:#664d03;padding:10px 14px;text-align:center;font-weight:600}
.msgs{max-height:220px;overflow:auto;margin:8px 0}.m{padding:6px 10px;border-radius:12px;margin:3px 0;max-width:80%;background:var(--g2)}.m.me{margin-left:auto;background:var(--g);color:#fff}
img.ph{width:54px;height:54px;object-fit:cover;border-radius:10px}.pr{display:flex;gap:10px;align-items:center;margin:8px 0}.pr>div{flex:1}.pr input{width:72px}
</style>
</head>
<body>
<div id="app"></div><div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ---- Config: the Supabase key below is a public (publishable) key; row-level security protects the data.
const SB_URL = "https://ukkwimgzbyjwnqknuxwe.supabase.co", SB_KEY = "sb_publishable_73UzjLEo5224KMqycG6-Xg_G3i854Vc";
// Paste a Google Maps JavaScript API key here (restrict it to your site address in Google Cloud). Empty = free OpenStreetMap fallback.
const GMAPS_KEY = "";

const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ok = r => { if (r.error) throw r.error; return r.data; };
const toast = m => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 4000); };
const guard = f => async (...a) => { try { await f(...a); } catch (x) { toast(x.message || String(x)); } };
const S = { u: null, p: null, farm: null, farms: [], v: "map", timer: null, uid: null };
let M = null, pickCb = null;

// ---- Map: Google Maps if a key is set, otherwise OpenStreetMap via Leaflet
const loadScript = src => new Promise((r, j) => { const s = document.createElement("script"); s.src = src; s.onload = r; s.onerror = j; document.head.appendChild(s); });
async function initMap() {
  const el = $("#map"), c = { lat: 0.2, lng: 37.9 };
  if (GMAPS_KEY) {
    await loadScript("https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(GMAPS_KEY));
    const g = new google.maps.Map(el, { center: c, zoom: 6, streetViewControl: false, mapTypeControl: false }); let mk = [];
    g.addListener("click", e => pickCb && pickCb(e.latLng.lat(), e.latLng.lng()));
    M = { clear() { mk.forEach(m => m.setMap(null)); mk = []; }, add(lat, lng, t, fn) { const m = new google.maps.Marker({ position: { lat, lng }, map: g, title: t }); m.addListener("click", fn); mk.push(m); }, go(lat, lng, z) { g.setCenter({ lat, lng }); g.setZoom(z); }, fix() { google.maps.event.trigger(g, "resize"); } };
  } else {
    const m = L.map(el).setView([c.lat, c.lng], 6), grp = L.layerGroup().addTo(m);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(m);
    m.on("click", e => pickCb && pickCb(e.latlng.lat, e.latlng.lng));
    M = { clear() { grp.clearLayers(); }, add(lat, lng, t, fn) { L.marker([lat, lng], { title: t }).on("click", fn).addTo(grp); }, go(lat, lng, z) { m.setView([lat, lng], z); }, fix() { m.invalidateSize(); } };
  }
}

// ---- Auth screens
function authView(mode = "in") {
  const up = mode === "up";
  $("#app").innerHTML = `<div class="auth"><h1>Mavuno</h1><p class="mut">Farm to plate, Kenya</p>
  <form data-f="${mode}">
  ${up ? `<input name="full_name" placeholder="Full name" required><input name="phone" placeholder="Phone (07…)" inputmode="tel" required><input name="county" placeholder="County" required>
  <select name="role"><option value="buyer">I want to buy</option><option value="farmer">I am a farmer</option></select>` : ""}
  <input name="email" type="email" placeholder="Email" required autocomplete="email">
  <input name="password" type="password" placeholder="Password (6+ characters)" minlength="6" required autocomplete="${up ? "new-password" : "current-password"}">
  <button class="btn" style="width:100%">${up ? "Create account" : "Log in"}</button></form>
  <p class="mut c">${up ? `Have an account? <a href="#" data-a="auth" data-m="in">Log in</a>` : `New here? <a href="#" data-a="auth" data-m="up">Create account</a> · <a href="#" data-a="reset">Forgot password</a>`}</p>
  ${up ? `<p class="mut c small">No email address? Make a free Gmail account first, then sign up here.</p>` : ""}</div>`;
}

// ---- App shell
function shell() {
  const fm = S.p.role === "farmer";
  $("#app").innerHTML = `<header><b>Mavuno</b><span class="mut">${esc(S.p.full_name)} · ${esc(S.p.role)}</span><a href="#" data-a="out">Log out</a></header>
  <div id="pick" hidden></div>
  <section id="v-map"><input id="q" placeholder="Search produce, farm or county"><div id="map"></div><div id="list"></div></section>
  <section id="v-orders" hidden></section><section id="v-farm" hidden></section>
  <nav><a href="#" data-a="nav" data-v="map">Map</a><a href="#" data-a="nav" data-v="orders">Orders</a>${fm ? `<a href="#" data-a="nav" data-v="farm">My farm</a>` : ""}</nav><div id="sheet" hidden></div>`;
  show("map"); initMap().then(loadFarms).catch(x => toast("Map failed to load: " + x.message));
}
function show(v) {
  S.v = v; stopChat();
  ["map", "orders", "farm"].forEach(k => { const e = $("#v-" + k); if (e) e.hidden = k !== v; });
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  if (v === "map" && M) M.fix();
}
const nav = guard(async v => { show(v); if (v === "map") await loadFarms(); if (v === "orders") await loadOrders(); if (v === "farm") await farmView(); });

// ---- Farms on the map
async function loadFarms() {
  S.farms = ok(await sb.from("farms").select("id,owner_id,name,description,county,ward,public_lat,public_lng,verified,products(id,name,category,price,unit,quantity_available,photo_url,active)"));
  drawFarms();
}
function drawFarms() {
  const q = ($("#q")?.value || "").toLowerCase().trim();
  const fs = S.farms.filter(f => !q || [f.name, f.county, f.ward, ...(f.products || []).map(p => p.name)].join(" ").toLowerCase().includes(q));
  if (M) { M.clear(); fs.forEach(f => f.public_lat != null && M.add(f.public_lat, f.public_lng, f.name, () => openFarm(f.id))); }
  $("#list").innerHTML = fs.length ? fs.map(f => `<div class="card" data-a="farm" data-id="${f.id}" style="cursor:pointer"><b>${esc(f.name)}</b> ${f.verified ? `<span class="tag">Verified</span>` : ""}
    <div class="mut small">${esc([f.ward, f.county].filter(Boolean).join(", "))}</div>
    <div class="small">${(f.products || []).filter(p => p.active).slice(0, 4).map(p => esc(p.name)).join(" · ") || "No produce listed yet"}</div></div>`).join("")
    : `<p class="mut c">${S.farms.length ? "No farms match your search." : "No farms yet. Farmers: create an account and add your farm."}</p>`;
}
const openFarm = guard(async id => {
  const f = S.farms.find(x => x.id === id); if (!f) return;
  if (f.public_lat != null && M) M.go(f.public_lat, f.public_lng, 12);
  const loc = ok(await sb.from("farm_locations").select("lat,lng").eq("farm_id", id).maybeSingle());
  const mine = S.farm?.id === id, items = (f.products || []).filter(p => p.active);
  $("#sheet").hidden = false;
  $("#sheet").innerHTML = `<div><div class="row"><h3 style="margin:0">${esc(f.name)}</h3><button class="alt" style="flex:0" data-a="close">Close</button></div>
  <p class="mut">${esc([f.ward, f.county].filter(Boolean).join(", "))} ${f.verified ? `<span class="tag">Verified</span>` : `<span class="tag">Not yet verified</span>`}</p>
  <p>${esc(f.description)}</p>
  ${loc ? `<p><a href="https://www.google.com/maps?q=${loc.lat},${loc.lng}" target="_blank" rel="noopener">Open exact farm location</a></p>` : `<p class="mut small">Exact location is shown after you send an order request.</p>`}
  <form data-f="order" data-id="${id}">${items.length ? items.map(p => `<div class="pr">${p.photo_url ? `<img class="ph" loading="lazy" src="${esc(p.photo_url)}" alt="">` : ""}<div><b>${esc(p.name)}</b><div class="mut small">KES ${esc(p.price)} / ${esc(p.unit)}${p.quantity_available != null ? ` · ${esc(p.quantity_available)} available` : ""}</div></div>
    ${mine ? "" : `<input type="number" min="0" step="any" name="q_${p.id}" placeholder="Qty">`}</div>`).join("") : `<p class="mut">Nothing listed yet.</p>`}
  ${mine || !items.length ? "" : `<button class="btn" style="width:100%">Send order request</button><p class="mut small">Pay cash on delivery. Agree delivery details in chat.</p>`}</form></div>`;
});

// ---- Orders and chat
async function loadOrders() {
  stopChat();
  const d = ok(await sb.from("orders").select("id,status,total,created_at,buyer_id,farm_id,farms(name),order_items(quantity,unit_price,products(name,unit))").order("created_at", { ascending: false }));
  $("#v-orders").innerHTML = d.length ? d.map(o => {
    const fmr = S.farm && o.farm_id === S.farm.id, b = (s, t, c = "") => `<button class="${c}" data-a="st" data-id="${o.id}" data-s="${s}">${t}</button>`;
    let act = "";
    if (fmr) act = o.status === "pending" ? b("accepted", "Accept") + b("rejected", "Reject", "bad") : o.status === "accepted" ? b("delivered", "Mark delivered") : "";
    else act = ["pending", "accepted"].includes(o.status) ? b("cancelled", "Cancel", "bad") : o.status === "delivered" ? b("completed", "Confirm received") : "";
    return `<div class="card"><div class="row"><b>${esc(o.farms?.name)}</b><span class="tag" style="flex:0">${esc(o.status)}</span></div>
    <div class="mut small">${fmr ? "Incoming order" : "Your order"} · ${new Date(o.created_at).toLocaleDateString()}</div>
    ${(o.order_items || []).map(i => `<div>${esc(i.quantity)} ${esc(i.products?.unit)} ${esc(i.products?.name)} × KES ${esc(i.unit_price)}</div>`).join("")}
    <div><b>Total KES ${esc(o.total)}</b></div><div class="row" style="margin-top:8px">${act}<button class="alt" data-a="chat" data-id="${o.id}">Chat</button></div><div id="c-${o.id}"></div></div>`;
  }).join("") : `<p class="mut c">No orders yet. Find a farm on the map and send an order request.</p>`;
}
const stopChat = () => { clearInterval(S.timer); S.timer = null; };
const loadMsgs = guard(async id => {
  const box = document.querySelector(`#c-${id} .msgs`); if (!box) return;
  const d = ok(await sb.from("messages").select("sender_id,body,created_at").eq("order_id", id).order("created_at"));
  box.innerHTML = d.map(m => `<div class="m ${m.sender_id === S.u.id ? "me" : ""}">${esc(m.body)}</div>`).join("") || `<p class="mut small">No messages yet. Say hello and agree on delivery.</p>`;
  box.scrollTop = box.scrollHeight;
});
function toggleChat(id) {
  const c = $("#c-" + id), open = c.innerHTML !== ""; document.querySelectorAll("[id^=c-]").forEach(e => e.innerHTML = ""); stopChat();
  if (open) return;
  c.innerHTML = `<div class="msgs"></div><form data-f="msg" data-id="${id}" class="row"><input name="body" placeholder="Type a message" required autocomplete="off"><button style="flex:0">Send</button></form>`;
  loadMsgs(id); S.timer = setInterval(() => loadMsgs(id), 4000);
}

// ---- Farmer: my farm and products
const farmView = guard(async () => {
  S.farm = ok(await sb.from("farms").select("*").eq("owner_id", S.u.id).limit(1).maybeSingle());
  const el = $("#v-farm");
  if (!S.farm) {
    el.innerHTML = `<h3>Set up your farm</h3><form data-f="farm"><input name="name" placeholder="Farm name" required><textarea name="description" rows="2" placeholder="What do you grow or keep?"></textarea>
    <input name="county" placeholder="County" value="${esc(S.p.county)}" required><input name="ward" placeholder="Ward / village">
    <p class="mut small">Farm location. Buyers only see an area about 100 m wide until they send you an order.</p>
    <div class="row"><input name="lat" placeholder="Latitude" required><input name="lng" placeholder="Longitude" required></div>
    <div class="row"><button type="button" class="alt" data-a="gps">Use my location</button><button type="button" class="alt" data-a="pick">Pick on map</button></div>
    <button class="btn" style="width:100%;margin-top:10px">Create farm</button></form>`;
    return;
  }
  const ps = ok(await sb.from("products").select("*").eq("farm_id", S.farm.id).order("created_at", { ascending: false }));
  el.innerHTML = `<div class="card"><b>${esc(S.farm.name)}</b> <span class="tag">${S.farm.verified ? "Verified" : "Awaiting verification"}</span><div class="mut small">${esc([S.farm.ward, S.farm.county].filter(Boolean).join(", "))}</div></div>
  <h3>Add produce</h3><form data-f="prod"><input name="name" placeholder="Product (e.g. Tomatoes)" required>
  <div class="row"><select name="category"><option>Vegetables</option><option>Fruits</option><option>Grains</option><option>Dairy</option><option>Eggs and poultry</option><option>Meat</option><option>Other</option></select>
  <select name="unit"><option>kg</option><option>bunch</option><option>crate</option><option>litre</option><option>piece</option><option>tray</option><option>bag</option></select></div>
  <div class="row"><input name="price" type="number" min="0" step="any" placeholder="Price (KES)" required><input name="qty" type="number" min="0" step="any" placeholder="Quantity available"></div>
  <input name="photo" type="file" accept="image/*"><button class="btn" style="width:100%">Add</button></form>
  <h3>Your produce</h3>${ps.map(p => `<div class="pr">${p.photo_url ? `<img class="ph" src="${esc(p.photo_url)}" alt="">` : ""}<div><b>${esc(p.name)}</b> ${p.active ? "" : `<span class="tag">Hidden</span>`}<div class="mut small">KES ${esc(p.price)} / ${esc(p.unit)} · ${esc(p.quantity_available ?? "–")} available</div></div>
  <button class="alt" style="flex:0" data-a="tog" data-id="${p.id}" data-on="${p.active ? 1 : 0}">${p.active ? "Hide" : "Show"}</button></div>`).join("") || `<p class="mut">No produce yet.</p>`}`;
});

// ---- Click and submit handlers
const A = {
  auth: d => authView(d.m),
  reset: guard(async () => { const e = prompt("Your account email"); if (!e) return; ok(await sb.auth.resetPasswordForEmail(e, { redirectTo: location.href.split("#")[0] })); toast("Check your email for the reset link."); }),
  out: () => sb.auth.signOut(),
  nav: d => nav(d.v),
  farm: d => openFarm(d.id),
  close: () => { $("#sheet").hidden = true; },
  chat: d => toggleChat(d.id),
  st: guard(async d => { ok(await sb.from("orders").update({ status: d.s }).eq("id", d.id)); await loadOrders(); toast("Order " + d.s); }),
  tog: guard(async d => { ok(await sb.from("products").update({ active: d.on !== "1" }).eq("id", d.id)); await farmView(); }),
  gps: () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => setLoc(p.coords.latitude, p.coords.longitude), () => toast("Could not get your location. Use Pick on map."), { enableHighAccuracy: true }) : toast("Location is not available on this device."),
  pick: () => { $("#pick").hidden = false; $("#pick").textContent = "Tap your farm on the map"; show("map"); pickCb = (la, lo) => { pickCb = null; $("#pick").hidden = true; setLoc(la, lo); show("farm"); }; }
};
function setLoc(la, lo) { const f = document.querySelector("form[data-f=farm]"); if (f) { f.lat.value = la.toFixed(6); f.lng.value = lo.toFixed(6); } }
document.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (!b) return; e.preventDefault(); A[b.dataset.a]?.(b.dataset, b); });
document.addEventListener("input", e => { if (e.target.id === "q") drawFarms(); });

const F = {
  in: async fd => { ok(await sb.auth.signInWithPassword({ email: fd.get("email").trim(), password: fd.get("password") })); },
  up: async fd => {
    const r = ok(await sb.auth.signUp({ email: fd.get("email").trim(), password: fd.get("password"), options: { data: { full_name: fd.get("full_name").trim(), phone: fd.get("phone").trim(), county: fd.get("county").trim(), role: fd.get("role") } } }));
    if (!r.session) { authView("in"); toast("Account created. Open the email we sent you, confirm, then log in."); }
  },
  order: async (fd, f) => {
    const farm = S.farms.find(x => x.id === f.dataset.id), lines = [];
    (farm.products || []).forEach(p => { const q = parseFloat(fd.get("q_" + p.id)); if (q > 0) lines.push({ p, q }); });
    if (!lines.length) return toast("Enter a quantity for at least one product.");
    const total = lines.reduce((s, l) => s + l.q * l.p.price, 0);
    const o = ok(await sb.from("orders").insert({ buyer_id: S.u.id, farm_id: farm.id, total, payment_mode: "cash_on_delivery", fulfilment: "to_negotiate" }).select("id").single());
    const it = await sb.from("order_items").insert(lines.map(l => ({ order_id: o.id, product_id: l.p.id, quantity: l.q, unit_price: l.p.price })));
    if (it.error) { await sb.from("orders").update({ status: "cancelled" }).eq("id", o.id); throw it.error; }
    A.close(); await nav("orders"); toast("Order request sent. Chat with the farmer to agree delivery.");
  },
  msg: async (fd, f) => { ok(await sb.from("messages").insert({ order_id: f.dataset.id, sender_id: S.u.id, body: fd.get("body").trim() })); f.reset(); await loadMsgs(f.dataset.id); },
  farm: async fd => {
    const la = parseFloat(fd.get("lat")), lo = parseFloat(fd.get("lng"));
    if (isNaN(la) || isNaN(lo)) return toast("Set your farm location first.");
    const j = () => (Math.random() - .5) * 0.0018;   // about ±100 m public blur
    const f = ok(await sb.from("farms").insert({ owner_id: S.u.id, name: fd.get("name").trim(), description: fd.get("description").trim(), county: fd.get("county").trim(), ward: fd.get("ward").trim(), public_lat: la + j(), public_lng: lo + j() }).select("id").single());
    ok(await sb.from("farm_locations").insert({ farm_id: f.id, lat: la, lng: lo }));
    toast("Farm created. Now add your produce."); await farmView();
  },
  prod: async (fd, form) => {
    let photo_url = null; const file = fd.get("photo");
    if (file && file.size) {
      if (file.size > 3e6) return toast("Photo is too big. Use one under 3 MB.");
      const path = `${S.u.id}/${Date.now()}-${file.name.replace(/[^\w.]/g, "")}`;
      ok(await sb.storage.from("photos").upload(path, file)); photo_url = sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
    }
    ok(await sb.from("products").insert({ farm_id: S.farm.id, name: fd.get("name").trim(), category: fd.get("category"), unit: fd.get("unit"), price: parseFloat(fd.get("price")), quantity_available: fd.get("qty") === "" ? null : parseFloat(fd.get("qty")), photo_url }));
    toast("Produce added."); await farmView();
  }
};
document.addEventListener("submit", e => { e.preventDefault(); const f = e.target; guard(F[f.dataset.f])(new FormData(f), f); });

// ---- Start-up
async function start(u) {
  S.u = u; if (!u) return authView("in");
  S.p = ok(await sb.from("profiles").select("*").eq("id", u.id).single());
  if (S.p.role === "farmer") S.farm = ok(await sb.from("farms").select("*").eq("owner_id", u.id).limit(1).maybeSingle());
  shell();
}
sb.auth.onAuthStateChange((ev, ses) => {
  if (ev === "PASSWORD_RECOVERY") setTimeout(() => { const p = prompt("Choose a new password (6+ characters)"); if (p) sb.auth.updateUser({ password: p }).then(r => toast(r.error ? r.error.message : "Password changed.")); }, 0);
  const id = ses?.user?.id || null; if (id === S.uid) return; S.uid = id;
  setTimeout(() => guard(start)(ses?.user || null), 0);
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
